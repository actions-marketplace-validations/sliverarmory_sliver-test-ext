name: Aggregate Sliver extension end-to-end results
description: Combine per-target JSON and JUnit results and enforce full matrix completion.

inputs:
  manifest:
    description: Path to the sliver-ext-e2e/v1 manifest, relative to the caller workspace.
    required: false
    default: .github/sliver-ext-e2e.yml
  library-root:
    description: Optional private root containing only planner-staged extension libraries.
    required: false
  results-dir:
    description: Directory containing downloaded per-target result files.
    required: false
    default: .sliver-ext-e2e/results
  mode:
    description: Internal mode override.
    required: false
    default: aggregate

outputs:
  results-dir:
    description: Absolute directory containing the aggregate outputs.

runs:
  using: node24
  main: ../../../dist/index.js
