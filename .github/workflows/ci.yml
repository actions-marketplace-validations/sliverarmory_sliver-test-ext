name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.6
          cache: false
      - run: go test -tags="client,go_sqlite" ./...

  node:
    name: Node tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node --test dist/index.test.js

  extension-e2e-smoke:
    name: Native extension smoke (Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.6
          cache: false
      - name: Build the native extension fixture
        shell: bash
        run: |
          mkdir -p test/fixture/build/linux/amd64
          cc -shared -fPIC -O2 -fno-stack-protector -nostdlib \
            -Wl,--no-undefined \
            -o test/fixture/build/linux/amd64/native_extension.so \
            test/fixture/native_extension.c
      - name: Run session and beacon extension tests
        uses: ./
        with:
          manifest: test/fixture/sliver-ext-e2e.yml
          target: linux/amd64
          github-token: ${{ github.token }}
      - name: Upload smoke results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sliver-ext-e2e-smoke-results
          path: .sliver-ext-e2e/results
          if-no-files-found: warn
          retention-days: 7

  extension-e2e-sequence:
    name: Stateful extension sequence (Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.6
          cache: false
      - name: Build the stateful RFB extension fixture
        shell: bash
        run: |
          mkdir -p test/fixture/build/linux/amd64
          cc -shared -fPIC -O2 -pthread -Wall -Wextra -Werror -Wl,-z,defs \
            -o test/fixture/build/linux/amd64/stateful_rfb_extension.so \
            test/fixture/stateful_rfb_extension.c
          test -x test/fixture/rfb_probe.py
          python3 --version
      - name: Run session and beacon lifecycle sequences
        uses: ./
        with:
          manifest: test/fixture/stateful-rfb-e2e.yml
          target: linux/amd64
          github-token: ${{ github.token }}
      - name: Upload sequence results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sliver-ext-e2e-sequence-results
          path: .sliver-ext-e2e/results
          if-no-files-found: warn
          retention-days: 7
